<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.wrap{max-width:460px;margin:0 auto;padding:18px 20px 36px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
.lang button{

}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.logo{display:block;width:78%;max-width:340px;margin:8px auto 4px;mix-blend-mode:multiply}
.name{font-family:'Lora',Georgia,serif;font-weight:600;font-size:30px;letter-spacing:.01em;text-align:center;margin-top:18px}

.div{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 22px}
.div i{display:block;height:2px;width:90px}
.div i:first-child{background:var(--green)} .div i:last-child{background:var(--red)}
.div b{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.btn{

  padding:17px 18px;border-radius:16px;font:500 16px 'Poppins',sans-serif;text-decoration:none;
  border:0;cursor:pointer;margin-bottom:12px;transition:transform .08s ease
}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.primary{background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(31,92,64,.25)}
.wa{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row svg{width:20px;height:20px;color:var(--gold);flex:none}
.row small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.row span{font-size:15px}
.foot{text-align:center;margin-top:30px;font-family:'Lora',Georgia,serif;font-size:14px;letter-spacing:.2em;color:#555}
.foot em{font-style:normal;color:var(--gold);letter-spacing:0;margin:0 8px}
.tag{text-align:center;font-size:11px;letter-spacing:.18em;color:#888;margin-top:10px;text-transform:uppercase}
</style>

  var l=(localStorage.getItem('itrea-lang')||'').slice(0,2);
  if(!T[l]){var n=(navigator.language||'en').slice(0,2).toLowerCase();l=T[n]?n:'en';}
  function apply(k){
    l=k;document.documentElement.lang=k;
    try{localStorage.setItem('itrea-lang',k)}catch(e){}
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=T[k][el.getAttribute('data-t')]});
    document.getElementById('wa').href='https://wa.me/393486464602?text='+encodeURIComponent(T[k].msg);
    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===k)});
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.l)})});
  apply(l);
})();
